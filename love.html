<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --blue: #00b4ff;
    --cyan: #00f3ff;
    --orange: #ff7a1a;
    --orange-deep: #ff4d00;
    --glass: rgba(255,255,255,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color:#fff; font-family:'Quicksand', system-ui, sans-serif; }
  body { min-height:100dvh; overflow-x:hidden; }

  /* Fondo: resplandores suaves + canvas de corazones */
  .glow-bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60vmax 60vmax at 0% 0%, rgba(0,140,255,.22), transparent 60%),
      radial-gradient(60vmax 60vmax at 100% 100%, rgba(255,100,0,.22), transparent 60%),
      #000;
  }
  canvas#fx { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

  main {
    position:relative; z-index:5;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px, 4vh, 34px);
    padding: max(28px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    text-align:center;
  }

  /* Título con degradado azul → naranja */
  h1 {
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(46px, 14vw, 78px);
    line-height:1;
    background:linear-gradient(90deg, var(--cyan), var(--blue) 35%, var(--orange) 70%, var(--orange-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 14px rgba(0,180,255,.45)) drop-shadow(0 0 22px rgba(255,110,0,.35));
    animation: floaty 5s ease-in-out infinite;
  }
  .sub {
    font-size:14px; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin-top:-8px;
  }

  /* Marco del video con borde degradado animado */
  .frame {
    position:relative;
    width:min(86vw, 360px);
    padding:3px;
    border-radius:22px;
    background:conic-gradient(from var(--a,0deg), var(--cyan), var(--blue), var(--orange), var(--orange-deep), var(--cyan));
    animation: spin 6s linear infinite;
    box-shadow:0 0 30px rgba(0,170,255,.35), 0 0 40px rgba(255,100,0,.3);
  }
  @property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  @keyframes spin { to { --a:360deg; } }
  .frame video {
    display:block; width:100%; max-height:34vh;
    border-radius:19px; background:#000; object-fit:contain;
  }
  .frame.sin-video { display:none; }

  /* Corazón neón (SVG) */
  .heart-btn {
    background:none; border:0; cursor:pointer;
    width:clamp(120px, 34vw, 150px); aspect-ratio:1;
    animation: beat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(0,180,255,.7)) drop-shadow(0 0 24px rgba(255,100,0,.6));
  }
  .heart-btn:active { transform:scale(.92); }
  .heart-btn svg { width:100%; height:100%; display:block; }
  @keyframes beat {
    0%,100% { transform:scale(1); }
    15% { transform:scale(1.1); }
    30% { transform:scale(1); }
    45% { transform:scale(1.07); }
  }

  /* Tarjeta con mensaje */
  .card {
    width:min(90vw, 380px);
    min-height:112px;
    display:flex; align-items:center; justify-content:center;
    padding:20px 22px;
    border-radius:20px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .card p {
    font-family:'Dancing Script', cursive;
    font-weight:600;
    font-size:clamp(24px, 7vw, 30px);
    line-height:1.25;
    transition:opacity .35s ease, transform .35s ease;
  }
  .card p.out { opacity:0; transform:translateY(8px); }

  .hint { font-size:13px; color:rgba(255,255,255,.5); }
  .hint b { color:var(--orange); font-weight:600; }

  @keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

  @media (prefers-reduced-motion: reduce) {
    .frame, h1, .heart-btn { animation:none; }
  }
  @media (max-height:640px) {
    .frame video { max-height:26vh; }
    main { gap:14px; }
  }
</style>
</head>
<body>
<div class="glow-bg"></div>
<canvas id="fx"></canvas>

<main>
  <div>
    <h1 id="titulo">Para ti</h1>
    <p class="sub" id="subtitulo">hecho con mucho cariño</p>
  </div>

  <!-- Si el video no carga, el marco se oculta solo -->
  <div class="frame" id="frame">
    <video id="vid" src="ositos 2.webm" autoplay muted loop playsinline controls></video>
  </div>

  <button class="heart-btn" id="heart" aria-label="Toca para ver un mensaje">
    <svg viewBox="0 0 100 92">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00f3ff"/>
          <stop offset=".45" stop-color="#00a2ff"/>
          <stop offset=".75" stop-color="#ff7a1a"/>
          <stop offset="1" stop-color="#ff4d00"/>
        </linearGradient>
      </defs>
      <path d="M50 88 C10 56 2 36 2 24 C2 11 12 2 25 2 C36 2 45 8 50 17 C55 8 64 2 75 2 C88 2 98 11 98 24 C98 36 90 56 50 88 Z" fill="url(#g)"/>
      <path d="M22 22 C24 16 30 12 36 12" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <div class="card"><p id="msg"></p></div>
  <p class="hint">toca el corazón <b>♥</b> para más mensajes</p>
</main>

<script>
/* ========= PERSONALIZA AQUÍ ========= */
const TITULO = "Para ti";
const SUBTITULO = "hecho con mucho cariño";
const MENSAJES = [
  "Te quiero mucho mucho mucho y te extraño",
  "Eres mi lugar favorito en el mundo",
  "Contigo hasta los días grises se vuelven bonitos",
  "Gracias por existir en mi vida",
  "Eres mi persona favorita, siempre",
  "Pienso en ti más de lo que imaginas",
  "Quiero muchos días más a tu lado"
];
/* ==================================== */

document.getElementById('titulo').textContent = TITULO;
document.getElementById('subtitulo').textContent = SUBTITULO;

/* Si el video no existe o falla, ocultamos el marco */
const vid = document.getElementById('vid');
vid.addEventListener('error', () => document.getElementById('frame').classList.add('sin-video'));
vid.addEventListener('loadeddata', () => vid.play().catch(()=>{}));

/* Mensajes */
const msgEl = document.getElementById('msg');
let idx = 0;
msgEl.textContent = MENSAJES[0];
function siguienteMensaje() {
  idx = (idx + 1) % MENSAJES.length;
  msgEl.classList.add('out');
  setTimeout(() => { msgEl.textContent = MENSAJES[idx]; msgEl.classList.remove('out'); }, 300);
}

/* Canvas de corazones y estrellitas */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const COLORS = [
  { c:'#00f3ff', g:'#00c3ff' },
  { c:'#2d8cff', g:'#0077ff' },
  { c:'#ff7a1a', g:'#ff5500' },
  { c:'#ffa040', g:'#ff7a00' }
];
const isSmall = W < 600;
const MAX = isSmall ? 38 : 70;
let parts = [];

function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(-s/2, -s*.3, -s, s/3, 0, s);
  ctx.bezierCurveTo(s, s/3, s/2, -s*.3, 0, s * .3);
  ctx.closePath();
}

class P {
  constructor(x, y, burst) { this.reset(x, y, burst); }
  reset(x, y, burst = false) {
    const col = COLORS[(Math.random() * COLORS.length) | 0];
    this.col = col; this.burst = burst;
    this.x = x ?? Math.random() * W;
    this.y = y ?? H + 20 + Math.random() * 60;
    this.s = (Math.random() * .7 + .35) * (burst ? 14 : 16);
    if (burst) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 1.5;
      this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp - 1;
      this.life = 1; this.decay = Math.random() * .014 + .01;
    } else {
      this.vx = (Math.random() - .5) * .4;
      this.vy = -(Math.random() * .9 + .35);
      this.life = Math.random() * .5 + .4; this.decay = 0;
    }
    this.ph = Math.random() * 6.28; this.rot = (Math.random() - .5) * .5;
    this.star = !burst && Math.random() < .25;
  }
  update() {
    this.ph += .03;
    this.x += this.vx + (this.burst ? 0 : Math.sin(this.ph) * .5);
    this.y += this.vy;
    if (this.burst) { this.vy += .04; this.life -= this.decay; }
    else if (this.y < -30) this.reset(undefined, H + 20);
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.shadowColor = this.col.g; ctx.shadowBlur = 12;
    ctx.fillStyle = this.col.c;
    if (this.star) {
      ctx.beginPath(); ctx.arc(0, 0, this.s * .18, 0, 6.28); ctx.fill();
    } else {
      ctx.rotate(this.rot);
      heartPath(this.s); ctx.fill();
      ctx.shadowBlur = 4; ctx.fillStyle = 'rgba(255,255,255,.85)';
      heartPath(this.s * .38); ctx.fill();
    }
    ctx.restore();
  }
}

for (let i = 0; i < MAX; i++) parts.push(new P(Math.random() * W, Math.random() * H));

function loop() {
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life > 0);
  let base = parts.filter(p => !p.burst).length;
  while (base++ < MAX) parts.push(new P());
  for (const p of parts) { p.update(); p.draw(); }
  requestAnimationFrame(loop);
}
loop();

function burst(x, y, n = 18) { for (let i = 0; i < n; i++) parts.push(new P(x, y, true)); }
const heart = document.getElementById('heart');
heart.addEventListener('click', e => {
  const r = heart.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 26);
  siguienteMensaje();
});
let down = false;
window.addEventListener('pointerdown', e => { down = true; if (!heart.contains(e.target)) burst(e.clientX, e.clientY, 7); });
window.addEventListener('pointermove', e => { if (down) burst(e.clientX, e.clientY, 1); });
window.addEventListener('pointerup', () => down = false);
</script>
</body>
</html>
